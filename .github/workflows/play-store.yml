name: Publicar en Play Store

# Se lanza a mano: GitHub → Actions → "Publicar en Play Store" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      app:
        description: App a publicar
        type: choice
        options: [cliente, conductor, ambas]
        default: cliente
      track:
        description: Pista de Play
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      estado:
        description: "completed = sale ya; draft = queda en borrador para revisarla en Play Console"
        type: choice
        options: [completed, draft]
        default: completed

jobs:
  publicar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: ${{ fromJSON(inputs.app == 'ambas' && '["cliente","conductor"]' || format('["{0}"]', inputs.app)) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable

      - name: Llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Sin la llave el build caería a la de pruebas y Play lo rechazaría: mejor fallar aquí.
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Faltan los secretos de la llave de firma"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=cargaexpress
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get
      - run: flutter test

      # versionCode = 100 + número de corrida: siempre sube y nunca choca con los subidos a mano.
      - name: Compilar AAB
        run: flutter build appbundle --release --flavor ${{ matrix.flavor }} --build-number=$((100 + ${{ github.run_number }}))

      - name: Subir a Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ matrix.flavor == 'cliente' && 'co.cargaexpress.app' || 'co.cargaexpress.conductor' }}
          releaseFiles: build/app/outputs/bundle/${{ matrix.flavor }}Release/app-${{ matrix.flavor }}-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.estado }}
