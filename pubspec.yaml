name: cargaexpress
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Mapas y ubicación
  flutter_map: ^8.3.0
  flutter_map_location_marker: ^10.3.0
  latlong2: ^0.9.1
  geolocator: ^13.0.4
  permission_handler: ^11.4.0

  # Rutas
  open_route_service: ^1.2.6

  # HTTP / APIs
  http: ^1.6.0
  dio: ^5.7.0
  socket_io_client: ^2.0.3

  # Firebase
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  firebase_crashlytics: ^4.3.1
  firebase_analytics: ^11.4.1

  # Almacenamiento
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilidades
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.4
  provider: ^6.1.2

  # Servicio en segundo plano
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.3.1

  # JSON
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_driver:
    sdk: flutter

  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3
  test: ^1.31.0

  # Generación de código
  json_serializable: ^6.9.4
  build_runner: ^2.4.14
  mockito: ^5.4.4

flutter:
  uses-material-design: true