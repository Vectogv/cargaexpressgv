name: cargaexpress
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Mapas y ubicación
  flutter_map: ^8.3.0
  open_route_service: ^1.2.6
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # HTTP / API
  http: ^1.6.0
  dio: ^5.7.0

  # Almacenamiento
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Estado
  provider: ^6.1.2

  # Multimedia
  image_picker: ^1.1.2

  # Comunicación
  socket_io_client: ^2.0.3
  connectivity_plus: ^6.1.4

  # Firebase
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  firebase_crashlytics: ^4.3.1
  firebase_analytics: ^11.4.1

  # Permisos / servicios
  permission_handler: ^11.0.0
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.3.1

  # Utilidades
  url_launcher: ^6.3.1
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_driver:
    sdk: flutter

  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter
  fake_async: ^1.3.3
  test: ^1.31.0

  # Generación de código
  json_serializable: ^6.9.4
  build_runner: ^2.4.14

  # Testing
  mockito: ^5.4.4

flutter:
  uses-material-design: true